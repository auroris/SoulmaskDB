<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="ui.title">Soulmask world.db browser</title>
<link rel="stylesheet" href="lib/datatables.net-dt/dataTables.dataTables.css">
<link rel="stylesheet" href="lib/datatables.net-columncontrol-dt/columnControl.dataTables.css">
<link rel="stylesheet" href="lib/datatables.net-colreorder-dt/colReorder.dataTables.css">
<link rel="stylesheet" href="lib/datatables.net-rowgroup-dt/rowGroup.dataTables.css">
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel2: #2d2d30;
    --border: #3e3e42;
    --text: #d4d4d4;
    --muted: #858585;
    --accent: #569cd6;
    --warn: #ce9178;
    --danger: #f48771;
    --ok: #6a9955;

    /* DataTables ColumnControl theming. The default stylesheet ships
       light-on-white; map every visible surface to our dark palette so
       header buttons aren't black on dark grey and dropdown popovers
       aren't white. Variables come from
       node_modules/datatables.net-columncontrol-dt/css/columnControl.dataTables.css */
    --dtcc-button-icon_color: var(--text);
    --dtcc-button_hover-background: rgba(255, 255, 255, 0.08);
    --dtcc-dropdown_background: var(--panel);
    --dtcc-dropdown_border: 1px solid var(--border);
    --dtcc-dropdown_box-shadow: 3px 4px 10px 1px rgba(0, 0, 0, 0.6);
    --dtcc-dropdown-button_color: var(--text);
    --dtcc-dropdown-button_hover-background: var(--panel2);
    --dtcc-search-icon_color: var(--text);
    --dtcc-search-icon_hover-background: rgba(255, 255, 255, 0.08);
    --dtcc-search-input_border: 1px solid var(--border);
    --dtcc-search-input_background: var(--bg);
    --dtcc-search-input_background-color: var(--bg);
    --dtcc-spacer_border: 1px solid var(--border);
    --dtcc-title_background: var(--panel2);
    --dtcc-list-buttons_background: rgba(255, 255, 255, 0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 13px; margin: 0; font-weight: normal; color: var(--accent); letter-spacing: 0.5px; }
  .spacer { flex: 1; }

  /* CSS-only decode spinner. Shown next to the files button while the
     worker pool is still streaming blob manifests into the search +
     references indices. app.mjs toggles `.hidden` on orchestrator
     'rows-ready' / 'file-loaded' / 'load-error'. */
  .spinner { width: 14px; height: 14px; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spinner-spin 0.8s linear infinite; }
  .spinner.hidden { display: none; }
  @keyframes spinner-spin { to { transform: rotate(360deg); } }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; cursor: pointer; font: inherit; border-radius: 2px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.danger  { color: var(--danger); border-color: var(--border); }
  button.danger:hover:not(:disabled) { border-color: var(--danger); }
  input[type="text"], input[type="search"], select, input[type="file"], textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 4px 8px; font: inherit; border-radius: 2px; min-width: 0;
  }
  textarea { font-family: inherit; resize: vertical; }
  input[type="file"]::file-selector-button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 2px 8px; margin-right: 8px; font: inherit; border-radius: 2px; cursor: pointer;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #summary { padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; }
  .stat { display: flex; gap: 6px; align-items: center; }
  .stat b { color: var(--accent); font-weight: normal; }
  #controls { padding: 6px 12px; display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  #controls[hidden] { display: none; }
  #controls #search { flex: 1; }
  #anchorChip { display: inline-flex; gap: 6px; align-items: center;
    padding: 2px 8px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel2); font-size: 12px; }
  #anchorChip.hidden { display: none; }
  #anchorChip label { color: var(--muted); }
  #anchorChip input[type="number"] { padding: 1px 4px; }
  #anchorChip button { padding: 0 6px; }
  #relationshipChip { display: inline-flex; gap: 6px; align-items: center;
    padding: 2px 8px; border: 1px solid var(--accent); border-radius: 12px;
    background: var(--panel2); font-size: 12px; color: var(--accent); }
  #relationshipChip.hidden { display: none; }
  #relationshipChip button { padding: 0 6px; }
  /* Focus-mode chip — same shape as the relationship chip but a different
     accent to make the two distinguishable when both happen to be live
     (focus-mode acts as a strict superset filter, so the relationship
     chip can still apply on top of it). */
  #focusChip { display: inline-flex; gap: 6px; align-items: center;
    padding: 2px 8px; border: 1px solid var(--warn); border-radius: 12px;
    background: var(--panel2); font-size: 12px; color: var(--warn); }
  #focusChip.hidden { display: none; }
  #focusChip button { padding: 0 6px; }

  /* Parent column jump link in the row table. */
  a.parent-link { color: var(--accent); text-decoration: none; }
  a.parent-link code { background: var(--bg); padding: 0 4px; border-radius: 2px;
    color: var(--accent); font-size: 11px; }
  a.parent-link:hover code { background: var(--panel2); }
  a.parent-link:hover { text-decoration: underline; }

  /* RowGroup headers — focus mode injects "Selected — #N" / "Children of #N"
     as group headers when the table groups by `_focusGroup`. The base
     RowGroup stylesheet renders the row mostly white-on-white; theme it
     so the headers stand out in our dark palette. */
  tr.dt-rowGroup-start td, tr.dt-rowGroup-end td {
    background: var(--panel2) !important;
    color: var(--accent);
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    font-size: 11px;
    padding: 6px 10px;
  }
  main { flex: 1; display: grid; grid-template-columns: 1fr; overflow: hidden; }
  /* Three-column grid when the detail panel is visible:
       [table (1fr)]  [resizer (4px)]  [detail (--detail-width, default 40%)]
     #detailResizer is a drag handle that updates --detail-width on <main>;
     app.js wires the mousedown/move/up plus localStorage persistence. */
  main.with-detail { grid-template-columns: minmax(0, 1fr) 4px var(--detail-width, 40%); }
  #tableWrap { overflow: auto; }
  #detail { border-left: 1px solid var(--border); overflow: auto; padding: 12px; background: var(--panel); }
  #detail.hidden { display: none; }
  #detailResizer { background: var(--border); cursor: col-resize; user-select: none; transition: background 0.1s; display: none; }
  main.with-detail > #detailResizer { display: block; }
  #detailResizer:hover, #detailResizer.dragging { background: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { position: sticky; top: 0; background: var(--panel2); padding: 5px 8px;
    text-align: left; border-bottom: 1px solid var(--border); font-weight: normal;
    color: var(--muted); user-select: none; z-index: 1; }
  td { padding: 3px 8px; border-bottom: 1px solid var(--panel2); vertical-align: top;
    white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  tr { cursor: pointer; }
  tr:hover td { background: #2a2d2e; }
  tr.selected td { background: #094771; }

  .pill { display: inline-block; padding: 0 6px; border-radius: 8px; background: var(--border);
    color: var(--muted); font-size: 11px; line-height: 16px; }
  /* Summary pills double as kind filters; visual hint + active state. */
  .pill.kind-pill { cursor: pointer; outline: 1px solid transparent; transition: outline-color 0.1s; }
  .pill.kind-pill:hover { outline-color: var(--accent); }
  .pill.kind-pill.active { outline-color: currentColor; outline-width: 2px; }
  .pill.system    { background: #5c1a1a; color: #f48771; }
  .pill.player    { background: #1a3a5c; color: #9cdcfe; }
  .pill.inventory { background: #2a4a4d; color: #4ec9b0; }
  .pill.npc       { background: #4d2a4d; color: #ce9178; }
  .pill.animal    { background: #3a4d2a; color: #b5cea8; }
  .pill.container { background: #4d3a1a; color: #d7a050; }
  .pill.station   { background: #3d3d1a; color: #d4d04a; }
  .pill.building  { background: #4a3d2c; color: #dcdcaa; }
  .pill.furniture { background: #3a2c4a; color: #c8a8e8; }
  .pill.vegetation{ background: #2d4a2a; color: #a8d08c; }
  .pill.region    { background: #2a3a4d; color: #82aaff; }
  .pill.vehicle   { background: #3a2a2a; color: #c89a8a; }
  .pill.other     { background: var(--border); color: var(--muted); }

  .muted { color: var(--muted); }
  .danger { color: var(--danger); }
  #pagination { padding: 6px 12px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center; background: var(--panel); }

  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 11px; margin: 0 0 6px 0; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.7px; font-weight: normal; }
  .field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; margin-bottom: 4px; align-items: start; }
  .field label { color: var(--muted); padding-top: 4px; }
  .field input, .field textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; font: inherit; width: 100%;
  }
  .field textarea { min-height: 60px; }
  .field.changed input, .field.changed textarea { border-color: var(--warn); background: #2a2520; }
  .field .span { padding-top: 4px; word-break: break-all; }

  pre.hex { background: var(--bg); border: 1px solid var(--border); padding: 8px;
    overflow: auto; font-size: 11px; line-height: 1.35; max-height: 360px; margin: 0;
    white-space: pre; }
  details { margin-bottom: 8px; }
  details > summary { cursor: pointer; color: var(--muted); padding: 2px 0; }
  details > summary:hover { color: var(--text); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .row-actions { display: flex; gap: 6px; align-items: center; }

  .loading { padding: 32px; text-align: center; color: var(--muted); flex: 1; }
  .loading code { background: var(--panel); padding: 2px 6px; border-radius: 2px; }
  #changedBadge { color: var(--warn); font-size: 11px; }

  /* DataTables overrides — the package ships with a light theme. Map its
     chrome to our dark palette so the pagination strip lives comfortably
     in the existing layout. We only opt into the `paging` layout block;
     no info / search / length-menu chrome is rendered. */
  #rowsTable_wrapper { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  /* The base DT stylesheet sets align-items:center on every .dt-layout-row,
     which on a tall .dt-layout-table flex container both clips the top of
     the table (rows pushed above the scroll origin so the first visible
     row is mid-table) AND vertically centers a short table inside its
     row's empty space. Force top-alignment so the table content starts
     at the top of the scroll viewport. */
  div.dt-container div.dt-layout-row.dt-layout-table { flex: 1; min-height: 0; overflow: auto; align-items: flex-start; }
  div.dt-container div.dt-layout-row.dt-layout-table > div { width: 100%; }
  div.dt-container div.dt-layout-row:last-child { padding: 6px 12px; border-top: 1px solid var(--border);
    background: var(--panel); margin: 0; }
  div.dt-container .dt-paging .dt-paging-button {
    color: var(--text) !important; background: var(--panel2) !important;
    border: 1px solid var(--border) !important; padding: 3px 9px !important;
    margin: 0 2px; font: inherit !important; border-radius: 2px !important;
  }
  div.dt-container .dt-paging .dt-paging-button.current,
  div.dt-container .dt-paging .dt-paging-button.current:hover {
    color: var(--accent) !important; border-color: var(--accent) !important;
    background: var(--panel) !important;
  }
  div.dt-container .dt-paging .dt-paging-button:hover:not(.disabled) {
    border-color: var(--accent) !important; background: var(--panel2) !important;
  }
  div.dt-container .dt-paging .dt-paging-button.disabled,
  div.dt-container .dt-paging .dt-paging-button.disabled:hover {
    color: var(--muted) !important; opacity: 0.4; cursor: not-allowed;
  }
  div.dt-container .dt-paging .ellipsis { color: var(--muted); padding: 0 4px; }
  /* Header / cell layout overrides:
       1. Title text is left-aligned in every column. DataTables sets
          `text-align: right` on `.dt-type-numeric` / `.dt-type-date`;
          we want consistent left alignment for both header and body.
       2. Force `flex-direction: row` on the numeric/date column headers
          (DataTables sets row-reverse for them) so the ColumnControl
          buttons live on the RIGHT side of the header — same side as
          for every other column. This both prevents the "two adjacent
          buttons" artifact between a wide non-numeric column and a
          numeric neighbour, and keeps ColumnControl's dropdown
          positioning working (`positionDropdown()` aligns the dropdown
          to the button's right edge when flexDirection is `row`). */
  table.dataTable th.dt-type-numeric, table.dataTable th.dt-type-date,
  table.dataTable td.dt-type-numeric, table.dataTable td.dt-type-date { text-align: left; }
  table.dataTable th.dt-type-numeric div.dt-column-header,
  table.dataTable th.dt-type-date    div.dt-column-header,
  table.dataTable td.dt-type-numeric div.dt-column-header,
  table.dataTable td.dt-type-date    div.dt-column-header { flex-direction: row; }
  /* Header sort indicators — DT injects span.dt-column-order in <th>s. */
  table.dataTable thead > tr > th.dt-orderable-asc,
  table.dataTable thead > tr > th.dt-orderable-desc,
  table.dataTable thead > tr > th.dt-ordering-asc,
  table.dataTable thead > tr > th.dt-ordering-desc { cursor: pointer; }
  table.dataTable thead > tr > th .dt-column-order::before,
  table.dataTable thead > tr > th .dt-column-order::after { color: var(--muted) !important; opacity: 0.6; }
  table.dataTable thead > tr > th.dt-ordering-asc  .dt-column-order::before,
  table.dataTable thead > tr > th.dt-ordering-desc .dt-column-order::after { color: var(--accent) !important; opacity: 1; }
  /* DT injects empty/processing rows — give them sensible dark-theme contrast. */
  table.dataTable tr.dt-empty td { color: var(--muted); text-align: center; padding: 16px !important; }

  /* Stash dialog. NB: the flex layout must be scoped to [open] so the
     browser's default `dialog:not([open]) { display: none }` still applies. */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 0; min-width: 600px; max-width: 90vw; max-height: 85vh; }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog header { background: var(--panel2); border-bottom: 1px solid var(--border); padding: 10px 14px; }
  dialog footer { background: var(--panel2); border-top: 1px solid var(--border);
    padding: 10px 14px; display: flex; gap: 8px; align-items: center; }
  #stashList { padding: 12px 14px; overflow-y: auto; flex: 1; }
  .stash-entry { padding: 10px; border: 1px solid var(--border); border-radius: 3px;
    margin-bottom: 8px; background: var(--bg); }
  .stash-header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .stash-label { color: var(--text); font-weight: bold; margin-bottom: 2px; }

  /* Structured property tree.
     Leaf nodes use <div class="prop-row">. Nodes that have nested
     children use <details class="prop-node"><summary class="prop-row">…
     </summary><div class="prop-children">…</div></details>. Both rows
     start with <span class="prop-chevron"></span> so the name column
     aligns whether or not the row is expandable. */
  .prop-tree-heading { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 4px; }
  .prop-tree { font-size: 12px; line-height: 1.5; }
  .prop-row { padding: 1px 0; border-left: 1px solid transparent; }
  .prop-row:hover { background: #2a2d2e; }
  .prop-name { color: #9cdcfe; }
  .prop-type { font-size: 11px; }
  .prop-val  { color: var(--text); }
  .prop-val code { background: var(--bg); padding: 0 4px; border-radius: 2px; color: #ce9178; font-size: 11px; }
  .prop-children { border-left: 1px dotted var(--border); margin-left: 6px; }
  .prop-chevron { display: inline-block; width: 12px; color: var(--muted); text-align: center; user-select: none; }
  details.prop-node > summary { list-style: none; cursor: pointer; }
  details.prop-node > summary::-webkit-details-marker { display: none; }
  details.prop-node       > summary > .prop-chevron::before { content: '▸'; }
  details.prop-node[open] > summary > .prop-chevron::before { content: '▾'; }

  /* Guid struct leaves render as jump links (resolved) or muted hex
     (unresolved — no loaded row claims that SelfUid). The resolved form
     also surfaces a "→ #<serial>" hint after the GUID. */
  .prop-guid { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  a.prop-guid.resolved { color: var(--accent); text-decoration: none; }
  a.prop-guid.resolved code { background: var(--bg); padding: 0 4px; border-radius: 2px;
    color: var(--accent); font-size: 11px; }
  a.prop-guid.resolved:hover code { background: var(--panel2); }
  a.prop-guid.resolved:hover { text-decoration: underline; }
  code.prop-guid.unresolved { color: var(--muted); background: var(--bg); padding: 0 4px;
    border-radius: 2px; font-size: 11px; }

  /* Relationships section in the detail panel.
       .rel-row     one outbound ref (parent), e.g. "ZhuRenGuid → #18699 Aleena"
       .rel-filters row of buttons that constrain the table to inbound refs. */
  .rel-row { display: flex; gap: 8px; align-items: baseline;
    padding: 2px 0; font-size: 12px; }
  .rel-row .rel-path { color: var(--muted); min-width: 130px; }
  .rel-row .rel-target { color: var(--text); word-break: break-all; }
  .rel-row a.prop-guid.resolved { color: var(--accent); }
  .rel-filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .rel-filters button.active { border-color: var(--accent); color: var(--accent); }

  /* Data files dialog (owned by js/data-service.mjs) */
  #dataDialog { min-width: 640px; }
  #dataList { padding: 12px 14px; overflow-y: auto; flex: 1; }
  .data-empty { padding: 24px; text-align: center; }
  .data-entry { border: 1px solid var(--border); border-radius: 3px;
    padding: 10px 12px; margin-bottom: 8px; background: var(--bg);
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    align-items: center; transition: border-color 0.1s; }
  .data-entry.invalid { border-color: var(--danger); }
  .data-entry.active  { border-color: var(--accent); }
  .data-entry-head { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
  .data-entry-name { color: var(--text); word-break: break-all; font-weight: bold; }
  .data-entry-badge { font-size: 11px; padding: 1px 7px; border-radius: 8px;
    background: var(--border); color: var(--muted); white-space: nowrap; }
  .data-entry-badge.world    { background: #1a3a5c; color: #9cdcfe; }
  .data-entry-badge.accounts { background: #2a4a4d; color: #4ec9b0; }
  .data-entry-badge.invalid  { background: #5c1a1a; color: #f48771; }
  .data-entry-badge.pending  { background: var(--border); color: var(--muted); }
  .data-entry-meta { font-size: 11px; grid-column: 1; }
  .data-entry-actions { grid-row: 1 / span 2; grid-column: 2;
    display: flex; gap: 6px; align-items: center; }

  /* Columns picker (Oracle APEX-style "Select Columns").
       Two stacked panes: "Do not display" and "Display". Buttons between
       them: ←/→ move the selected row across, ↑/↓ reorder within the
       Display pane. Selection state is a single CSS class on the row. */
  #columnsDialog { min-width: 520px; }
  #columnsPicker {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    gap: 12px;
    align-items: stretch;
    padding: 14px;
  }
  .cp-pane { display: flex; flex-direction: column; min-width: 0; }
  .cp-pane-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.7px; margin-bottom: 4px; }
  .cp-list {
    list-style: none; padding: 4px; margin: 0;
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    min-height: 200px; max-height: 320px; overflow: auto; flex: 1;
  }
  .cp-list:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
  .cp-item { padding: 4px 8px; border-radius: 2px; cursor: pointer; user-select: none;
    border: 1px solid transparent; }
  .cp-item:hover { background: var(--panel2); }
  .cp-item.selected { background: #094771; border-color: var(--accent); color: var(--text); }
  .cp-buttons { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .cp-buttons button { padding: 4px 10px; min-width: 38px; }

  /* Whole-window drop overlay shown while a file is being dragged in. */
  #dropOverlay { position: fixed; inset: 0; background: rgba(86, 156, 214, 0.08);
    border: 2px dashed var(--accent); pointer-events: none; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.12s; }
  #dropOverlay.visible { opacity: 1; }
  #dropOverlay .label { background: var(--panel); border: 1px solid var(--accent);
    border-radius: 4px; padding: 12px 24px; color: var(--accent); font-size: 14px;
    letter-spacing: 0.5px; }
</style>
</head>
<body>

<header>
  <h1 data-i18n="ui.header.title">SOULMASK db</h1>
  <button id="manageFilesBtn" class="primary" data-i18n="ui.header.files" data-i18n-title="ui.header.files.title" title="Open the database files dialog">files</button>
  <span id="decodeSpinner" class="spinner hidden" data-i18n-title="ui.header.decoding" title="decoding blobs…" aria-label="decoding blobs"></span>
  <span id="status" class="muted"></span>
  <span class="spacer"></span>
  <select id="langSelect" data-i18n-title="ui.header.language" title="Language"></select>
  <button id="stashBtn" data-i18n-title="ui.header.stash.title" title="Open the row stash">stash (0)</button>
  <span id="changedBadge"></span>
</header>

<section id="summary" hidden></section>

<section id="controls" hidden>
  <input type="search" id="search" data-i18n-placeholder="ui.search.placeholder" placeholder="filter (also searches strings inside blobs)">
  <span id="filterCount" class="muted"></span>
  <button id="columnsBtn" title="Choose which columns to display and their order">columns…</button>
  <button id="anchorAtBtn" data-i18n="ui.anchor.atButton" data-i18n-title="ui.anchor.atButton.title">📍 anchor at…</button>
  <span id="anchorChip" class="hidden"></span>
  <span id="relationshipChip" class="hidden"></span>
  <span id="focusChip" class="hidden"></span>
</section>

<main id="main">
  <div id="tableWrap">
    <table id="rowsTable" class="display compact" style="width:100%"><thead></thead><tbody></tbody></table>
  </div>
  <div id="detailResizer" aria-hidden="true" role="separator" aria-orientation="vertical"></div>
  <aside id="detail" class="hidden"></aside>
</main>

<div id="empty" class="loading">
  <p data-i18n-html="ui.empty.choose">No database loaded. Click <b>files</b> or drop a <code>.db</code> on the page.</p>
</div>

<div id="dropOverlay" aria-hidden="true">
  <div class="label" data-i18n="ui.data.dropHere">drop to add file</div>
</div>

<dialog id="dataDialog">
  <header style="display:flex; justify-content:space-between; align-items:center;">
    <strong data-i18n="ui.data.heading">Database files</strong>
    <button id="dataDialogClose" data-i18n="ui.data.close">close</button>
  </header>
  <div id="dataList"></div>
  <footer>
    <label class="row-actions">
      <span data-i18n="ui.data.addLabel">add file:</span>
      <input type="file" id="dataFileInput" accept=".db,.sqlite,.db3" multiple style="max-width:260px;">
    </label>
  </footer>
</dialog>

<dialog id="collisionDialog">
  <header style="display:flex; justify-content:space-between; align-items:center;">
    <strong data-i18n="ui.collision.heading">Row collision</strong>
  </header>
  <div style="padding:12px 14px;">
    <p id="collisionMessage" style="margin:0 0 8px 0; word-break:break-all;"></p>
    <p id="collisionNote" class="muted" style="margin:0;"></p>
  </div>
  <footer>
    <button id="collisionCancel" data-i18n="ui.collision.cancel">Cancel</button>
    <span class="spacer" style="flex:1;"></span>
    <button id="collisionRenumber" data-i18n="ui.collision.renumber">Renumber &amp; paste</button>
    <button id="collisionReplace" class="danger" data-i18n="ui.collision.replace">Replace existing</button>
  </footer>
</dialog>

<dialog id="columnsDialog">
  <header style="display:flex; justify-content:space-between; align-items:center;">
    <strong>Columns</strong>
    <button id="columnsDialogClose">close</button>
  </header>
  <div id="columnsPicker">
    <div class="cp-pane">
      <div class="cp-pane-label">Do not display</div>
      <ol id="cpHiddenList" class="cp-list" tabindex="0"></ol>
    </div>
    <div class="cp-buttons">
      <button id="cpMoveRight" title="Show selected column" disabled>→</button>
      <button id="cpMoveLeft"  title="Hide selected column" disabled>←</button>
    </div>
    <div class="cp-pane">
      <div class="cp-pane-label">Display</div>
      <ol id="cpDisplayedList" class="cp-list" tabindex="0"></ol>
    </div>
    <div class="cp-buttons">
      <button id="cpMoveUp"   title="Move selected column earlier" disabled>↑</button>
      <button id="cpMoveDown" title="Move selected column later"   disabled>↓</button>
    </div>
  </div>
  <footer>
    <span class="spacer" style="flex:1;"></span>
    <button id="columnsDialogReset">reset to defaults</button>
  </footer>
</dialog>

<dialog id="stashDialog">
  <header style="display:flex; justify-content:space-between; align-items:center;">
    <strong data-i18n="ui.stash.heading">Row stash</strong>
    <button id="stashClose" data-i18n="ui.stash.close">close</button>
  </header>
  <div id="stashList"></div>
  <footer>
    <button id="stashExport" data-i18n="ui.stash.export">⤓ export to file</button>
    <label class="row-actions">
      <span data-i18n="ui.stash.importLabel">⤒ import:</span>
      <input type="file" id="stashImportInput" accept=".json" style="max-width:240px;">
    </label>
    <span class="spacer" style="flex:1;"></span>
    <button id="stashClear" class="danger" data-i18n="ui.stash.clear">clear all</button>
  </footer>
</dialog>

<!--
  Load order:
    1. sqlite3.js (classic, deferred) — exposes globalThis.sqlite3InitModule
    2. js/bootstrap.mjs (ES module)   — imports everything (Unreal codecs,
                                        services, i18n, classify, steam,
                                        stash, partials, RowTable),
                                        populates SMDB.* for transitional
                                        callsites, then dynamically imports
                                        js/app.mjs.

  bootstrap.mjs uses top-level `await` (transitively via blob.mjs's lz4
  init). The dynamic import of app.mjs at the end of bootstrap is what
  guarantees SMDB.* is fully populated before app.mjs reads it. There
  are no classic defer scripts in this page besides sqlite3.js, which
  publishes its own self-contained global and doesn't depend on us.
-->
<!--
  Import map for the few third-party packages we load as ESM via bare
  specifiers (jquery + DataTables). Must appear BEFORE the first module
  script that resolves any mapped name. The files are copied out of
  node_modules at build time — see .eleventy.js passthroughs.
-->
<script type="importmap">
{
  "imports": {
    "jquery":                            "/lib/jquery/jquery.module.js",
    "datatables.net":                    "/lib/datatables.net/dataTables.mjs",
    "datatables.net-dt":                 "/lib/datatables.net-dt/dataTables.dataTables.mjs",
    "datatables.net-columncontrol":      "/lib/datatables.net-columncontrol/dataTables.columnControl.mjs",
    "datatables.net-columncontrol-dt":   "/lib/datatables.net-columncontrol-dt/columnControl.dataTables.mjs",
    "datatables.net-colreorder":         "/lib/datatables.net-colreorder/dataTables.colReorder.mjs",
    "datatables.net-colreorder-dt":      "/lib/datatables.net-colreorder-dt/colReorder.dataTables.mjs",
    "datatables.net-rowgroup":           "/lib/datatables.net-rowgroup/dataTables.rowGroup.mjs",
    "datatables.net-rowgroup-dt":        "/lib/datatables.net-rowgroup-dt/rowGroup.dataTables.mjs",
    "flexsearch":                        "/lib/flexsearch/flexsearch.module.mjs"
  }
}
</script>
<script src="lib/sqlite3/sqlite3.js" defer></script>
<script type="module" src="js/bootstrap.mjs"></script>
</body>
</html>
